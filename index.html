<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Control Producción Grupo Conectar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra de pestañas de marca arriba, barra de configuración, calendario a la izquierda y tabla de todos los códigos a la derecha. */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --surface-2:#ebebe8; --line:#d9d8d3;
  --fg:#2b2a27; --muted:#6b6962; --brand:#fcc200; --brand-ink:#2b2a27; --gris:#5e5c54;
  --ok:#1f8a3c; --danger:#e01e19; --excel:#107c41;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19; --surface:#262522; --surface-2:#32312d; --line:#413f3a;
  --fg:#efeee9; --muted:#a3a097; --ok:#4cc16c; --danger:#ff6b66; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1c1b19; --surface:#262522; --surface-2:#32312d; --line:#413f3a;
  --fg:#efeee9; --muted:#a3a097; --ok:#4cc16c; --danger:#ff6b66; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
.bleed{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
.nav{background:var(--gris);border-bottom:4px solid var(--brand)}
.nav .wrap{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;padding:10px 16px 10px 0;color:#fff;font-weight:700;line-height:1.15;margin-right:auto}
.brand small{font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.tab{background:none;border:0;color:rgba(255,255,255,.7);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:16px 16px;cursor:pointer;margin-bottom:-4px;border-bottom:4px solid transparent}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brand);background:rgba(255,255,255,.08)}
.theme{background:none;border:0;color:#fff;cursor:pointer;padding:0 8px;font-weight:600;font-size:12px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:16px;margin-top:18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;min-width:0;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg)}
.hint{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.err{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px}
.lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media(max-width:820px){.lay{grid-template-columns:minmax(0,1fr)}}
.side{padding:16px}
h2,h3{margin:0}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.cal .h{font-size:10px;font-weight:700;text-align:center;color:var(--muted)}
.cb{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;text-align:center;position:relative}
.cb:hover{background:var(--surface-2)}
.cb.has::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cb.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.main{padding:16px;min-width:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dh h3{font-size:16px;font-weight:700}
.drv{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:14px 0;border-radius:8px;background:rgba(252,194,0,.16);font-weight:600;cursor:pointer;font-size:13px}
.drv input{width:22px;height:22px;min-height:22px;padding:0;accent-color:#fcc200;flex:none}
.find{margin-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
td.cod{font-weight:700}
td input{width:76px;text-align:center;font-weight:700;min-height:36px;padding:5px 6px}
tr.on td{background:rgba(252,194,0,.10)}
tfoot td{font-weight:800;border-bottom:0;background:var(--surface-2)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px}
.tot{text-align:right;line-height:1.15}
.tot .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:44px}
.btn.red{background:var(--danger);color:#fff}
.btn.xl{background:var(--excel);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.rh{padding:22px 16px;text-align:center;border-bottom:1px solid var(--line)}
.rh h2{font-size:20px;font-weight:800}
.rh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.sumfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:var(--gris);color:#fff;border-radius:0 0 8px 8px}
.sumfoot b{color:var(--brand);font-size:26px;font-variant-numeric:tabular-nums}
.act{display:flex;gap:12px;align-items:end;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.act label.f{flex:1;max-width:340px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.cons{margin-top:18px;padding:20px;max-width:640px}
.ch{font-size:18px;font-weight:700;margin-bottom:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.res{margin-top:18px;padding:18px;border-radius:8px;background:var(--surface-2);text-align:center}
.res .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res .v{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.res.ok{background:rgba(252,194,0,.16)}
@media(prefers-reduced-motion:no-preference){.cb,.btn{transition:background .12s}}
</style>

<header class="nav bleed"><div class="wrap" role="tablist">
  <div class="brand"><small>Grupo Conectar</small>Control Producción</div>
  <button class="tab" id="tabCarga" role="tab" aria-selected="true" aria-controls="vCarga" type="button">Carga diaria</button>
  <button class="tab" id="tabRes" role="tab" aria-selected="false" aria-controls="vRes" type="button">Resumen mensual</button>
  <button class="tab" id="tabCons" role="tab" aria-selected="false" aria-controls="vCons" type="button">Consulta de precio</button>
  <button class="theme" id="theme" type="button" aria-label="Cambiar entre modo claro y oscuro">Modo oscuro</button>
</div></header>

<main class="wrap">
<section id="vCarga" role="tabpanel" aria-labelledby="tabCarga">
  <div class="panel cfg">
    <label class="f" for="selMes">Carpeta / Mes<input type="month" id="selMes"></label>
    <label class="f" for="fIni">Fecha inicio<input type="date" id="fIni"></label>
    <label class="f" for="fFin">Fecha fin<input type="date" id="fFin"></label>
    <label class="f" for="selCat">Categoría<select id="selCat"></select><span class="hint" id="horaInfo"></span></label>
  </div>
  <div class="err" id="cfgErr" role="alert"></div>

  <div class="lay">
    <aside class="panel side">
      <h3 class="lbl">Seleccioná un día</h3>
      <div class="cal" id="cal"></div>
    </aside>
    <div class="panel main" id="dayBox"></div>
  </div>

  <div class="panel foot">
    <button class="btn red" id="btnBorrar" type="button">Borrar período completo</button>
    <div class="tot"><span class="lbl">Total del período estimado</span><div class="big" id="totMes" aria-live="polite">$ 0,00</div></div>
  </div>
</section>

<section id="vRes" role="tabpanel" aria-labelledby="tabRes" hidden>
  <div class="panel" style="margin-top:18px;overflow:hidden">
    <div class="rh"><h2>Consolidado del período</h2><p id="resMeta">Resumen de todas las semanas (incluye adicional conductor)</p></div>
    <div class="tw"><table id="tRes"></table></div>
    <div class="sumfoot"><span style="font-weight:700;text-transform:uppercase">Total acumulado</span><b id="totAcum">$ 0,00</b></div>
  </div>
  <div class="act">
    <label class="f" for="operario">Nombre del operario (obligatorio)<input id="operario" maxlength="60" autocomplete="name" required placeholder="Ej: Juan Pérez"></label>
    <button class="btn xl" id="btnXls" type="button">Descargar Excel</button>
  </div>
  <div class="err" id="xErr" role="alert" style="text-align:right"></div>
</section>
<section id="vCons" role="tabpanel" aria-labelledby="tabCons" hidden>
  <div class="panel cons">
    <h2 class="ch">Consulta de precio</h2>
    <div class="cgrid">
      <label class="f" for="qCat">Categoría<select id="qCat"></select></label>
      <label class="f" for="qCod">Código<select id="qCod"></select></label>
    </div>
    <div class="res" id="qRes" aria-live="polite"></div>
  </div>
</section>
</main>

<script>
(function(){
'use strict';
/* =====================================================================
   VALORES FIJOS. Solo administración los modifica, editando este bloque.
   Precio = valor hora de la categoría x coeficiente del código.
   Para un mes nuevo: cambiar SOLO los valores de HORA.
   ===================================================================== */
var HORA={'OFICIAL ESPECIALIZADO':8249.09,'OFICIAL':7040.63,'MEDIO OFICIAL':6252.33,'AYUDANTE':5520.38};
var ADIC_CONDUCTOR=1022.28329325;
var CODIGOS=[["COD 01", 1.0], ["COD 02", 0.67], ["COD 03", 0.2], ["COD 04", 0.33], ["COD 05", 0.17], ["COD 06", 0.13], ["COD 07", 0.25], ["COD 09", 0.47], ["COD 10", 0.8], ["COD 12", 0.71], ["COD 13", 0.22], ["COD 15", 1.0], ["COD 16", 1.8], ["COD 17", 0.85], ["COD 20", 0.4], ["COD 21", 0.05], ["COD 22", 0.47], ["COD 23", 0.2], ["COD 25", 0.67], ["COD 26", 0.5], ["COD 28", 0.25], ["COD 29", 0.33], ["COD 31", 0.05], ["COD 33", 0.25], ["COD 51", 0.05], ["COD 61", 0.13], ["COD 62", 0.05], ["COD 63", 0.25], ["COD 71", 0.25], ["COD 71S", 0.82], ["COD 92", 1.05], ["COD 100", 0.5], ["COD 110", 0.75], ["COD 111", 0.75], ["COD 112", 2.0], ["COD 113", 2.0], ["COD 200", 1.0], ["COD 200L", 1.0], ["COD 220", 0.2], ["COD 250", 1.5], ["COD 312", 0.22], ["COD 313", 0.22], ["COD 314", 0.22], ["COD 701", 0.75], ["COD 702", 0.17], ["COD 1001", 2.0], ["COD 1001A", 2.6], ["COD 1003", 0.75], ["COD 1004", 2.25], ["COD 1005", 0.83], ["COD 1006", 1.0], ["COD 1007", 0.75], ["COD 1008", 0.5], ["COD 1009", 1.0], ["COD 1010", 0.75], ["COD 1011", 0.5], ["COD 1012", 1.5], ["COD 1013", 0.75], ["COD 1014", 0.58], ["COD 1015", 0.75], ["COD 1016", 0.75], ["COD 1017", 0.17], ["COD 1018", 0.0], ["COD 1020", 0.33], ["COD 1021", 0.75], ["COD 1021 A", 1.0], ["COD 1021 B", 1.25]]; /* [código, coeficiente] */
/* ===================================================================== */

var CATS=Object.keys(HORA), COEF={};
CODIGOS.forEach(function(c){COEF[c[0]]=c[1];});
var KEY='cp_conectar_v2';
var $=function(id){return document.getElementById(id);};
var money=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'});
var M=function(n){return money.format(n||0);};
var r2=function(n){return Math.round(n*100)/100;};
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dmy(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function okDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ds(pd(s))===s;}
function okMes(s){return typeof s==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(s);}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;}

/* ---------- datos (se guardan en este dispositivo) ---------- */
var DB={meses:{},cat:'OFICIAL',mes:null};
function mesNuevo(m){var y=+m.slice(0,4),n=+m.slice(5,7),u=new Date(y,n,0).getDate();return {inicio:m+'-01',fin:m+'-'+String(u).padStart(2,'0'),dias:{}};}
function sanitize(raw){
  var out={meses:{},cat:'OFICIAL',mes:null};
  try{
    if(!raw||typeof raw!=='object')return out;
    if(CATS.indexOf(raw.cat)>=0)out.cat=raw.cat;
    Object.keys(raw.meses||{}).slice(0,240).forEach(function(m){
      var r=raw.meses[m];if(!okMes(m)||!r||!okDate(r.inicio)||!okDate(r.fin)||pd(r.fin)<pd(r.inicio))return;
      var q={inicio:r.inicio,fin:r.fin,dias:{}};
      Object.keys(r.dias||{}).forEach(function(d){
        var x=r.dias[d];if(!okDate(d)||!x||typeof x.codes!=='object'||x.codes===null)return;
        var c={};Object.keys(x.codes).forEach(function(k){var v=+x.codes[k];if(COEF.hasOwnProperty(k)&&isFinite(v)&&v>0&&v<=99999)c[k]=v;});
        if(Object.keys(c).length||x.conductor===true)q.dias[d]={conductor:x.conductor===true,codes:c};
      });
      out.meses[m]=q;
    });
    if(okMes(raw.mes))out.mes=raw.mes;
  }catch(e){}
  return out;
}
var persistOk=true;
function load(){try{DB=sanitize(JSON.parse(localStorage.getItem(KEY)));}catch(e){DB=sanitize(null);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));persistOk=true;}catch(e){persistOk=false;}}

var selDay=null,tab='carga',delTimer=null;
function cfg(){if(!DB.meses[DB.mes])DB.meses[DB.mes]=mesNuevo(DB.mes);return DB.meses[DB.mes];}

/* ---------- cálculo ---------- */
function precio(cat,cod){return r2(HORA[cat]*COEF[cod]);}
function precioCond(cod){return r2(ADIC_CONDUCTOR*COEF[cod]);}
function sub(cat,cod,qty,cond){return qty*precio(cat,cod)+(cond?qty*precioCond(cod):0);}
function enRango(f,d){return d>=f.inicio&&d<=f.fin;}
function totDia(f,d){var x=f.dias[d];if(!x)return 0;var t=0;Object.keys(x.codes).forEach(function(k){t+=sub(DB.cat,k,x.codes[k],x.conductor);});return t;}
function totMes(f){var t=0;Object.keys(f.dias).forEach(function(d){if(enRango(f,d))t+=totDia(f,d);});return t;}
function semanas(f){ /* igual que la app anterior: la semana cierra el domingo */
  var W=[{}],i=0,d=pd(f.inicio),e=pd(f.fin),n=0;
  while(d<=e&&n<400){W[i][ds(d)]=true;if(d.getDay()===0&&d<e){i++;W[i]={};}d.setDate(d.getDate()+1);n++;}
  return W;
}

/* ---------- render ---------- */
function renderCfg(){
  var f=cfg();
  $('selMes').value=DB.mes;$('fIni').value=f.inicio;$('fFin').value=f.fin;
  if($('selCat').value!==DB.cat)$('selCat').value=DB.cat;
  $('horaInfo').textContent='Valor hora '+M(HORA[DB.cat])+' · Adic. conductor '+M(ADIC_CONDUCTOR);
}
function renderCal(){
  var f=cfg(),c=$('cal');clear(c);
  ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'].forEach(function(x){c.appendChild(el('div',x,'h'));});
  var d=pd(f.inicio),e=pd(f.fin),n=0;
  for(var i=0;i<d.getDay();i++)c.appendChild(el('div'));
  if(selDay&&!enRango(f,selDay))selDay=null;
  while(d<=e&&n<400){
    (function(s,dt){
      var b=el('button',dt.getDate()+'/'+(dt.getMonth()+1),'cb'+(s===selDay?' sel':'')+(f.dias[s]&&Object.keys(f.dias[s].codes).length?' has':''));
      b.type='button';b.setAttribute('aria-pressed',s===selDay?'true':'false');
      b.addEventListener('click',function(){selDay=s;renderCal();renderDay();});
      c.appendChild(b);
    })(ds(d),new Date(d));
    d.setDate(d.getDate()+1);n++;
  }
}
var rowRefs={};
function renderDay(){
  var box=$('dayBox');clear(box);rowRefs={};
  if(!selDay){box.appendChild(el('div','Seleccioná un día en el calendario para cargar la producción.','empty'));updateTotals();return;}
  var f=cfg();
  var x=f.dias[selDay]||{conductor:false,codes:{}};
  var h=el('div',null,'dh');h.appendChild(el('h3','Carga del día '+dmy(pd(selDay))));
  h.appendChild(el('span',DB.cat,'lbl'));box.appendChild(h);
  var lab=el('label',null,'drv'),chk=document.createElement('input');chk.type='checkbox';chk.checked=!!x.conductor;chk.id='chkCond';
  lab.setAttribute('for','chkCond');lab.appendChild(chk);lab.appendChild(el('span','¿Conductor en este día? Suma el adicional a todo lo cargado hoy'));
  chk.addEventListener('change',function(){day().conductor=chk.checked;cleanDay();save();refreshRows();updateTotals();renderCal();});
  box.appendChild(lab);
  var find=document.createElement('input');find.type='search';find.className='find';find.placeholder='Buscar código…';find.setAttribute('aria-label','Buscar código');find.maxLength=30;find.id='find';
  box.appendChild(find);
  var tw=el('div',null,'tw'),t=document.createElement('table'),hd=document.createElement('thead'),bd=document.createElement('tbody'),ft=document.createElement('tfoot');
  var hr=document.createElement('tr');['Código','Cantidad','Subtotal'].forEach(function(s){hr.appendChild(el('th',s));});hd.appendChild(hr);
  CODIGOS.forEach(function(c){
    var cod=c[0],r=document.createElement('tr');
    r.appendChild(el('td',cod,'cod'));
    var tc=document.createElement('td'),inp=document.createElement('input');
    inp.type='number';inp.min='0';inp.max='99999';inp.step='any';inp.inputMode='decimal';inp.setAttribute('aria-label','Cantidad de '+cod);
    inp.value=x.codes[cod]!=null?x.codes[cod]:'';
    inp.addEventListener('input',function(){
      var v=inp.value===''?0:+inp.value;
      if(!isFinite(v)||v<0||v>99999)return;
      var d=day();if(v===0)delete d.codes[cod];else d.codes[cod]=v;
      cleanDay();save();refreshRow(cod);updateTotals();renderCal();
    });
    tc.appendChild(inp);r.appendChild(tc);
    var ts=el('td','');r.appendChild(ts);bd.appendChild(r);rowRefs[cod]={tr:r,sub:ts};
  });
  var fr=document.createElement('tr'),c1=el('td','Total del día');c1.colSpan=2;c1.style.textAlign='right';
  var c2=el('td','');c2.id='totDia';fr.appendChild(c1);fr.appendChild(c2);ft.appendChild(fr);
  t.appendChild(hd);t.appendChild(bd);t.appendChild(ft);tw.appendChild(t);box.appendChild(tw);
  find.addEventListener('input',function(){
    var q=find.value.trim().toLowerCase();
    Object.keys(rowRefs).forEach(function(k){rowRefs[k].tr.hidden=q!==''&&k.toLowerCase().indexOf(q)<0;});
  });
  refreshRows();updateTotals();
}
function day(){var f=cfg();if(!f.dias[selDay])f.dias[selDay]={conductor:false,codes:{}};return f.dias[selDay];}
function cleanDay(){var f=cfg(),d=f.dias[selDay];if(d&&!d.conductor&&!Object.keys(d.codes).length)delete f.dias[selDay];}
function refreshRow(cod){
  var f=cfg(),x=f.dias[selDay],q=x&&x.codes[cod]?x.codes[cod]:0,r=rowRefs[cod];if(!r)return;
  r.sub.textContent=q>0?M(sub(DB.cat,cod,q,x.conductor)):'–';
  r.tr.className=q>0?'on':'';
}
function refreshRows(){Object.keys(rowRefs).forEach(refreshRow);}
function updateTotals(){
  var f=cfg();
  $('totMes').textContent=M(totMes(f));
  var td=$('totDia');if(td)td.textContent=M(selDay?totDia(f,selDay):0);
}

function renderRes(){
  var f=cfg(),W=semanas(f),t=$('tRes');clear(t);
  var hd=document.createElement('thead'),bd=document.createElement('tbody'),hr=document.createElement('tr');
  hr.appendChild(el('th','Cód.'));W.forEach(function(_,i){hr.appendChild(el('th','Sem '+(i+1)));});
  hr.appendChild(el('th','Total u.'));hr.appendChild(el('th','Monto $'));hd.appendChild(hr);
  var tot=0,filas=0;
  CODIGOS.forEach(function(c){
    var cod=c[0],uMes=0,sMes=0,cells=[];
    W.forEach(function(w){
      var u=0;
      Object.keys(w).forEach(function(d){var x=f.dias[d];if(x&&x.codes[cod]){u+=x.codes[cod];sMes+=sub(DB.cat,cod,x.codes[cod],x.conductor);}});
      uMes+=u;cells.push(u>0?String(u):'–');
    });
    if(uMes<=0)return;
    filas++;tot+=sMes;
    var r=document.createElement('tr');r.appendChild(el('td',cod,'cod'));
    cells.forEach(function(s){r.appendChild(el('td',s));});
    r.appendChild(el('td',String(Math.round(uMes*1000)/1000)));r.appendChild(el('td',M(sMes)));bd.appendChild(r);
  });
  if(!filas){var r=document.createElement('tr'),c=el('td','Todavía no hay producción cargada en este período.','empty');c.colSpan=W.length+3;c.style.textAlign='center';r.appendChild(c);bd.appendChild(r);}
  t.appendChild(hd);t.appendChild(bd);
  $('totAcum').textContent=M(tot);
  $('resMeta').textContent='Período del '+dmy(pd(f.inicio))+' al '+dmy(pd(f.fin))+' | Categoría: '+DB.cat;
}

/* ---------- eventos ---------- */
function renderAll(){renderCfg();renderCal();renderDay();if(tab==='res')renderRes();}
function err(t){$('cfgErr').textContent=t;}
$('selMes').addEventListener('change',function(){
  var m=$('selMes').value;if(!okMes(m)){renderCfg();return;}
  DB.mes=m;selDay=null;cfg();save();err('');renderAll();
});
function cambiarFechas(){
  var f=cfg(),a=$('fIni').value,b=$('fFin').value;
  if(!okDate(a)||!okDate(b)){err('Completá las dos fechas.');return;}
  if(pd(b)<pd(a)){err('La fecha fin no puede ser anterior al inicio.');renderCfg();return;}
  if((pd(b)-pd(a))/864e5>366){err('El período no puede superar un año.');renderCfg();return;}
  var fuera=Object.keys(f.dias).filter(function(d){return d<a||d>b;});
  if(fuera.length){err('Hay '+fuera.length+' día(s) con carga fuera de ese rango. Ampliá las fechas o borrá el período.');renderCfg();return;}
  err('');f.inicio=a;f.fin=b;save();renderAll();
}
$('fIni').addEventListener('change',cambiarFechas);$('fFin').addEventListener('change',cambiarFechas);
CATS.forEach(function(c){$('selCat').appendChild(el('option',c)).value=c;});
$('selCat').addEventListener('change',function(){if(CATS.indexOf($('selCat').value)<0)return;DB.cat=$('selCat').value;save();renderCfg();refreshRows();updateTotals();if(tab==='res')renderRes();if(selDay)renderDay();});
$('btnBorrar').addEventListener('click',function(){
  var b=$('btnBorrar');
  if(!delTimer){b.textContent='Confirmar: borrar todo el período';delTimer=setTimeout(function(){delTimer=null;b.textContent='Borrar período completo';},4000);return;}
  clearTimeout(delTimer);delTimer=null;b.textContent='Borrar período completo';
  cfg().dias={};selDay=null;save();renderAll();
});
function setTab(t){tab=t;
  [['carga','vCarga','tabCarga'],['res','vRes','tabRes'],['cons','vCons','tabCons']].forEach(function(x){
    $(x[1]).hidden=t!==x[0];$(x[2]).setAttribute('aria-selected',t===x[0]);});
  if(t==='res')renderRes();if(t==='cons')renderCons();}
$('tabCarga').addEventListener('click',function(){setTab('carga');});
$('tabRes').addEventListener('click',function(){setTab('res');});
$('tabCons').addEventListener('click',function(){setTab('cons');});
function renderCons(){
  var cat=$('qCat').value,cod=$('qCod').value,r=$('qRes');clear(r);
  if(CATS.indexOf(cat)<0||!COEF.hasOwnProperty(cod)){r.className='res';r.appendChild(el('div','Elegí la categoría y el código para ver el precio.','k'));return;}
  r.className='res ok';
  r.appendChild(el('div',cod+' · '+cat,'k'));
  r.appendChild(el('div',M(precio(cat,cod)),'v'));
}
function initCons(){
  var c=$('qCat'),k=$('qCod');
  var o=el('option','Elegí una categoría');o.value='';c.appendChild(o);
  CATS.forEach(function(x){var p=el('option',x);p.value=x;c.appendChild(p);});
  var q=el('option','Elegí un código');q.value='';k.appendChild(q);
  CODIGOS.forEach(function(x){var p=el('option',x[0]);p.value=x[0];k.appendChild(p);});
  c.addEventListener('change',renderCons);k.addEventListener('change',renderCons);
}
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function themeLabel(){$('theme').textContent=isDark()?'Modo claro':'Modo oscuro';}
$('theme').addEventListener('click',function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('cp_theme',n);}catch(e){}themeLabel();});

/* ---------- Excel ---------- */
$('btnXls').addEventListener('click',function(){
  var e=$('xErr');e.textContent='';
  var nombre=$('operario').value.trim();
  if(!/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2}/.test(nombre)){e.textContent='Escribí tu nombre y apellido para descargar el Excel.';$('operario').setAttribute('aria-invalid','true');$('operario').focus();return;}
  $('operario').removeAttribute('aria-invalid');
  if(!window.XLSX){e.textContent='No se pudo cargar el generador de Excel. Revisá la conexión y recargá la página.';return;}
  var f=cfg(),W=semanas(f);
  var head=['COD'];W.forEach(function(_,i){head.push('SEM '+(i+1));});head.push('TOTAL U.','MONTO $');
  var rows=[head],tot=0;
  CODIGOS.forEach(function(c){
    var cod=c[0],u=0,s=0,r=[cod];
    W.forEach(function(w){var uw=0;Object.keys(w).forEach(function(d){var x=f.dias[d];if(x&&x.codes[cod]){uw+=x.codes[cod];s+=sub(DB.cat,cod,x.codes[cod],x.conductor);}});u+=uw;r.push(uw>0?uw:'');});
    if(u<=0)return;r.push(u,r2(s));tot+=s;rows.push(r);
  });
  var blank=[];for(var i=0;i<head.length-1;i++)blank.push('');
  rows.push(blank.slice(0,head.length-2).concat(['TOTAL ACUMULADO',r2(tot)]));
  var ws=XLSX.utils.aoa_to_sheet(rows),last=head.length-1;
  for(var R=1;R<rows.length;R++){var ref=XLSX.utils.encode_cell({r:R,c:last});if(ws[ref]&&typeof ws[ref].v==='number')ws[ref].z='#,##0.00';}
  ws['!cols']=head.map(function(_,i){return {wch:i===0?14:(i===last?16:10)};});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Resumen Produccion');
  var nom=nombre.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
  var fn='Resumen_'+DB.mes+'_'+nom+'.xlsx';
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  function directo(){try{XLSX.writeFile(wb,fn);}catch(x){e.textContent='No se pudo generar el archivo Excel.';}}
  if(window.claude&&claude.use){
    claude.use('downloads').then(function(dl){
      if(!dl){directo();return;}
      dl.save({filename:fn,data:buf}).catch(function(er){if(!er||er.code!=='declined')e.textContent='No se pudo guardar el Excel.';});
    },directo);
  }else directo();
});

/* ---------- arranque ---------- */
load();
try{var th=localStorage.getItem('cp_theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);}catch(x){}
if(!DB.mes||!okMes(DB.mes)){var h=new Date();DB.mes=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0');}
themeLabel();initCons();renderAll();
})();
</script>
