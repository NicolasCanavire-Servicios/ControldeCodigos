<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Control de Producción - Grupo Conectar">
    <title>Control Producción - Grupo Conectar</title>
    <!-- Tipografía secundaria ofcial como respaldo (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <!-- Librería PDF (Carga diferida) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <!-- Archivos separados -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app-container">
        <nav class="nav-tabs" aria-label="Navegación principal">
            <button class="tab-btn active" id="btn-carga" aria-controls="view-carga" aria-selected="true" onclick="showTab('carga')">Carga Diaria</button>
            <button class="tab-btn" id="btn-resumen" aria-controls="view-resumen" aria-selected="false" onclick="showTab('resumen')">Resumen Mensual</button>
            <button id="btn-theme" class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar modo oscuro">🌙</button>
        </nav>

        <section id="view-carga" aria-labelledby="btn-carga">
            <header class="config-bar">
                <div class="field">
                    <label for="selMes">Mes de Facturación</label>
                    <input type="month" id="selMes" name="mes" onchange="cambiarMes()">
                </div>
                <div class="field">
                    <label for="selObra">Obra</label>
                    <select id="selObra" name="obra" onchange="renderApp()">
                        <option value="resto">OTRAS OBRAS (RESTO)</option>
                        <option value="subestaciones">TAREAS EN SUBESTACIONES</option>
                    </select>
                </div>
                <div class="field">
                    <label for="selCat">Categoría</label>
                    <select id="selCat" name="categoria" onchange="renderApp()">
                        <option value="OFICIAL ESPECIALIZADO">OFICIAL ESPECIALIZADO</option>
                        <option value="OFICIAL">OFICIAL</option>
                        <option value="MEDIO Oficial">MEDIO OFICIAL</option>
                        <option value="AYUDANTE">AYUDANTE</option>
                    </select>
                </div>
            </header>

            <div class="calendar-layout">
                <aside class="calendar-sidebar">
                    <h3 class="text-label-small">Selecciona un día</h3>
                    <div id="calendar-grid" class="calendar-grid"></div>
                </aside>
                <div class="daily-form-container" id="daily-form-container">
                    <p class="text-label-small" style="padding: 20px;">Selecciona un día en el calendario para cargar la producción.</p>
                </div>
            </div>

            <footer class="footer-summary">
                <button class="btn-reset" onclick="borrarMes()">BORRAR MES COMPLETO</button>
                <div class="total-box">
                    <span class="text-label-small">TOTAL DEL MES ESTIMADO</span>
                    <div class="total-val" id="totalMesResumen" aria-live="polite">$ 0,00</div>
                </div>
            </footer>
        </section>

        <section id="view-resumen" class="hidden" aria-labelledby="btn-resumen">
            <div id="pdf-area">
                <header class="pdf-header">
                    <h2 class="pdf-title">Consolidado Mensual</h2>
                    <p id="pdf-meta" class="pdf-subtitle">Resumen de todas las semanas (incluye adicional conductor)</p>
                </header>
                <div class="table-container">
                    <table id="tableResumen">
                        <thead>
                            <tr>
                                <th class="col-code">COD</th>
                                <th scope="col">SEM 1</th>
                                <th scope="col">SEM 2</th>
                                <th scope="col">SEM 3</th>
                                <th scope="col">SEM 4</th>
                                <th scope="col">SEM 5</th>
                                <th scope="col">SEM 6</th>
                                <th class="bg-light-gray" scope="col">TOTAL U.</th>
                                <th class="bg-success-light" scope="col">MONTO $</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyResumen"></tbody>
                    </table>
                </div>
                <footer class="footer-summary pdf-footer">
                    <div class="pdf-footer-text">Total Acumulado Mensual</div>
                    <div class="total-val text-success-bright" id="totalMensual" aria-live="polite">$ 0,00</div>
                </footer>
            </div>
            <div class="action-panel">
                <button class="btn-pdf" onclick="exportarPDF()">DESCARGAR PDF</button>
            </div>
        </section>
    </main>
</body>
</html>
